name: Обновяване на кадастралните данни (пилот Бургас)
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 1'
permissions:
  contents: write
concurrency:
  group: cadastre-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pyshp pyproj
      - name: Изтегляне и индексиране на данните за 07079
        run: python cadastre-earth/tools/sync_kais.py --ekatte 07079 --output cadastre-earth/data/07079.json
      - name: Запис само при реално получени данни
        run: |
          git add cadastre-earth/data/07079.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Burgas cadastral index'
            git push
          fi
