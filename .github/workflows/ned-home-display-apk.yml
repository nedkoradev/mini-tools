name: Build NED Home Display APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ned-home-display/**'
      - '.github/workflows/ned-home-display-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ned-home-display
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already include Android SDK.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NED-Home-Display-APK
          path: ned-home-display/app/build/outputs/apk/debug/app-debug.apk
