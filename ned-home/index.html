<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1423"><title>NED Home v1.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1423;color:#edf4ff;font:15px Arial,Helvetica,sans-serif}header{background:#111f33;border-bottom:1px solid #293a53;padding:17px max(18px,calc((100vw - 1250px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:700}.version{font-size:12px;color:#8fa9c7}.sub,.muted{color:#91a9c6;font-size:12px}.sub{margin-top:5px}.right{text-align:right}#clock{font-size:26px;font-weight:700}.wrap{max-width:1250px;margin:auto;padding:20px 18px 40px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}button{border:1px solid #416087;background:#1d3554;color:#e9f2ff;border-radius:9px;padding:10px 15px;cursor:pointer;font-size:14px}button:hover{background:#28476d}button:focus-visible,input:focus-visible{outline:2px solid #83b8ff}button.active{background:#2e69ad;border-color:#5794da}.pill{border-radius:18px;border:1px solid #345172;background:#1a2c45;color:#c1d7f1;padding:9px 13px;font-size:13px}.auth{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:12px 0 16px}.auth input{background:#1a2c45;border:1px solid #486688;border-radius:8px;color:#fff;padding:10px;max-width:210px}.section-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2c415c;margin:25px 0 13px;padding-bottom:9px}.section-head h2{margin:0;font-size:20px}.section-head .muted{font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#192b43;border:1px solid #30435f;border-radius:14px;padding:16px;min-height:137px}.card-title{font-size:16px;font-weight:700;color:#e3edfb;margin-bottom:13px;overflow-wrap:anywhere}.metrics{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.metric{min-width:70px;flex:1}.metric-label{color:#9db4d0;font-size:12px;margin-bottom:5px}.metric-value{font-size:25px;font-weight:700;white-space:nowrap}.temperature{color:#ffbd80}.humidity{color:#99caff}.battery{color:#b6c9de}.battery.low{color:#ff9494}.metric-value.missing{color:#7e92ac}.other-reading{font-size:19px;color:#b8d8ff;font-weight:700}.card-note{color:#93abc8;font-size:12px;margin-top:10px}.alert{padding:13px;background:#4b302c;color:#ffe0d5;border-radius:10px;margin-bottom:14px}.empty{padding:20px;background:#192b43;border-radius:12px;color:#b2c8e5}.foot{margin-top:27px;color:#8fa6c3;font-size:12px}#content:empty{display:none}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:750px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:14px 12px}.card{padding:13px}.metric-value{font-size:23px}}@media(max-width:430px){.cards{grid-template-columns:1fr}.brand{font-size:21px}#clock{font-size:21px}.card{min-height:0}.metric{min-width:75px}}
</style></head><body><header><div><div class="brand">⌂ NED Home <span class="version">v1.1</span></div><div class="sub">Домашен информационен панел · Tuya / Smart Life</div></div><div class="right"><div id="clock">--:--</div><div class="sub" id="date"></div></div></header><main class="wrap"><div class="toolbar"><button id="refresh">↻ Обнови</button><span class="pill" id="status">Свързване…</span></div><div id="auth" class="auth" style="display:none"><label for="password">Парола за панела:</label><input id="password" type="password" autocomplete="off"><button id="login">Влез</button></div><div id="message"></div><div id="content"><div class="empty">Зареждане на данни…</div></div><div class="foot">Само наблюдение · Без управление на устройства · Автоматично обновяване на 30 секунди</div></main><script src="/app.js"></script></body></html>
