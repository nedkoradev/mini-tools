<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transport Lab v0.3</title><style>body{font:16px system-ui;background:#eef3f8;color:#19334c;margin:24px}main{display:grid;grid-template-columns:1fr 260px;gap:16px}section,aside{background:white;padding:16px;border-radius:12px}input,button,select{font:inherit;padding:7px;margin:5px}label{display:block}canvas{width:100%;background:#edf3fa;touch-action:none}td{padding:5px;border-bottom:1px solid #ddd}@media(max-width:700px){main{display:block}}</style><a href="../">Mini Tools</a><h1>NED-IQ Transport Lab v0.3</h1><p>Експериментален оптимизатор · пълна геометрична опора · без гаранция за глобален минимум или товароносимост</p><main><section><h3 id="summary"></h3><select id="bin"></select><canvas id="cv" width="900" height="500"></canvas><p id="dims"></p><p>Плъзни за завъртане. Синя рамка: допустим обем.</p><div id="rows"></div><h3>Извън габаритите</h3><div id="bad"></div></section><aside><label>Ширина (мм)<input id="W" type="number" value="1200"></label><label>Дължина (мм)<input id="D" type="number" value="800"></label><label>Височина (мм)<input id="H" type="number" value="800"></label><label>Опити<input id="N" type="number" value="60" min="1" max="1000"></label><button id="run">Оптимизирай</button><p id="status"></p><button id="exp">Експорт JSON</button><p>73 анонимизирани детайла от Excel. Разрешено завъртане в хоризонталната равнина.</p></aside></main><script>const data=[[600,560,18,1],[742,560,18,4],[564,560,18,1],[564,88,18,1],[564,60,18,1],[588,142,18,1],[1553,100,18,1],[870,560,18,1],[696,560,18,1],[834,88,18,1],[834,60,18,1],[712,150,18,1],[724,560,18,1],[560,120,18,1],[354,586,18,2],[142,740,18,1],[1470,600,38,1],[1470,600,18,1],[955,560,18,1],[742,560,18,2],[919,560,18,1],[919,88,18,1],[919,60,18,1],[304,740,18,2],[311,740,18,1],[1574,600,38,1],[1546,100,18,1],[860,589,18,1],[600,162,18,1],[1574,600,18,1],[594,740,18,1],[600,600,18,1],[600,282,18,1],[864,297,18,2],[787,297,18,2],[900,787,3,1],[751,297,18,2],[900,391,18,2],[864,297,18,2],[787,297,18,2],[900,787,3,1],[751,297,18,2],[900,391,18,2],[842,297,18,2],[600,297,18,1],[900,600,3,1],[564,297,18,2],[855,598,18,1],[864,297,18,2],[869,297,18,2],[900,869,3,1],[833,297,18,2],[900,431,18,2]];function solve(data,W,D,H,N){let p=data.flatMap(([a,b,h,n])=>Array.from({length:n},()=>({a,b,h}))).map((q,i)=>({...q,id:i+1})),bad=p.filter(q=>q.h>H||!(q.a<=W&&q.b<=D||q.b<=W&&q.a<=D)),good=p.filter(q=>!bad.includes(q)),best=null,seed=42;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}for(let t=0;t<N;t++){let bins=[];let order=good.map(q=>({q,k:(t%5===0?q.a*q.b:t%5===1?Math.max(q.a,q.b)**2:t%5===2?Math.min(q.a,q.b)**2:t%5===3?Math.max(q.a,q.b)*Math.min(q.a,q.b)**.4:Math.min(q.a,q.b)*Math.max(q.a,q.b)**.4)*(t<3?1:Math.exp((rnd()-.5)*.45))})).sort((a,b)=>b.k-a.k);for(let {q} of order){let pick;for(let i=0;i<=bins.length;i++){let bin=bins[i]||[];for(let [w,d] of [[q.a,q.b],[q.b,q.a]]){if(w>W||d>D)continue;let xs=new Set([0,W-w]),ys=new Set([0,D-d]);for(let r of bin){xs.add(r.x);xs.add(r.x+r.w-w);xs.add(r.x+r.w);xs.add(r.x-w);ys.add(r.y);ys.add(r.y+r.d-d);ys.add(r.y+r.d);ys.add(r.y-d)}for(let x of xs)for(let y of ys){if(x<0||y<0||x+w>W||y+d>D)continue;let z=0,area=0;for(let r of bin){let a=Math.max(0,Math.min(x+w,r.x+r.w)-Math.max(x,r.x))*Math.max(0,Math.min(y+d,r.y+r.d)-Math.max(y,r.y));if(!a)continue;let top=r.z+r.h;if(top>z){z=top;area=a}else if(top===z)area+=a}if(z+q.h>H||z&&area!==w*d)continue;let score=(t%4===0?z:-z)*100000+x+y;if(!pick||score<pick.score)pick={i,score,r:{...q,x,y,z,w,d}}}}if(pick)break}if(!bins[pick.i])bins.push([]);bins[pick.i].push(pick.r)}let height=bins.reduce((s,b)=>s+Math.max(...b.map(r=>r.z+r.h)),0);if(!best||bins.length<best.bins.length||bins.length===best.bins.length&&height>best.height)best={bins,bad,height};if(bins.length<=1)break}return best};const $=id=>document.getElementById(id);let result,angle=.7,drag=null,W=1200,D=800,H=800;function table(b){let t=document.createElement('table');for(let q of b){let r=t.insertRow();for(let v of [q.id,q.a+' × '+q.b+' × '+q.h,q.x===undefined?'—':[q.x,q.y,q.z].join(' / ')])r.insertCell().textContent=v}return t}function draw(){if(!result)return;let b=result.bins[+$('bin').value]||[],ctx=$('cv').getContext('2d'),s=Math.sin(angle),c=Math.cos(angle),k=300/Math.max(W,D,H);ctx.clearRect(0,0,900,500);function P(x,y,z){return [450+((x-W/2)*c-(y-D/2)*s)*k,350+((x-W/2)*s+(y-D/2)*c)*k*.45-z*k]}function poly(a,col){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(...P(...p)):ctx.moveTo(...P(...p)));ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#466785';ctx.stroke()}poly([[0,0,0],[W,0,0],[W,D,0],[0,D,0]],'#d1dce8');for(let q of [...b].sort((a,b)=>a.z-b.z||a.x*s+a.y*c-b.x*s-b.y*c)){let {x,y,z,w,d,h}=q,Z=z+h;for(let [u,v,U,V] of [[x,y,x+w,y],[x+w,y,x+w,y+d],[x+w,y+d,x,y+d],[x,y+d,x,y]])poly([[u,v,z],[U,V,z],[U,V,Z],[u,v,Z]],'#82abc9');poly([[x,y,Z],[x+w,y,Z],[x+w,y+d,Z],[x,y+d,Z]],'#b1d2ec')}ctx.strokeStyle='#3275b4';ctx.setLineDash([5,4]);for(let z of [0,H]){ctx.beginPath();[[0,0],[W,0],[W,D],[0,D],[0,0]].forEach(([x,y],i)=>i?ctx.lineTo(...P(x,y,z)):ctx.moveTo(...P(x,y,z)));ctx.stroke()}for(let [x,y] of [[0,0],[W,0],[W,D],[0,D]]){ctx.beginPath();ctx.moveTo(...P(x,y,0));ctx.lineTo(...P(x,y,H));ctx.stroke()}ctx.setLineDash([])}function refresh(){let b=result.bins[+$('bin').value]||[],u=b.length?Math.max(...b.map(q=>q.x+q.w))-Math.min(...b.map(q=>q.x)):0,v=b.length?Math.max(...b.map(q=>q.y+q.d))-Math.min(...b.map(q=>q.y)):0,h=Math.max(0,...b.map(q=>q.z+q.h));$('dims').textContent='Ширина: '+u+' / '+W+' мм · Дължина: '+v+' / '+D+' мм · Височина: '+h+' / '+H+' мм ('+Math.round(h/H*100)+'%) · Свободна височина: '+(H-h)+' мм';$('rows').replaceChildren(table(result.bins[+$('bin').value]||[]));draw()}$('bin').onchange=refresh;$('cv').onpointerdown=e=>{drag=e.clientX;$('cv').setPointerCapture(e.pointerId)};$('cv').onpointermove=e=>{if(drag!==null){angle+=(e.clientX-drag)*.01;drag=e.clientX;draw()}};$('cv').onpointerup=()=>drag=null;$('run').onclick=()=>{let a=['W','D','H','N'].map(i=>+$(i).value);if(a.some(x=>!Number.isInteger(x)||x<=0)||a[3]>1000)return;$('run').disabled=true;$('status').textContent='Изчисляване…';let url=URL.createObjectURL(new Blob([solve.toString()+';onmessage=e=>postMessage(solve(...e.data))'],{type:'text/javascript'})),w=new Worker(url);function done(){w.terminate();URL.revokeObjectURL(url);$('run').disabled=false}w.onmessage=e=>{result=e.data;[W,D,H]=a;done();$('status').textContent='Готово';$('summary').textContent=result.bins.length+' товара · '+result.bins.flat().length+' подредени · '+result.bad.length+' извън габаритите';$('bin').replaceChildren(...result.bins.map((b,i)=>new Option('Товар '+(i+1)+' · '+b.length+' бр.',i)));$('bad').replaceChildren(table(result.bad));refresh()};w.onerror=()=>{done();$('status').textContent='Грешка'};w.postMessage([data,...a])};$('exp').onclick=()=>{if(!result)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({W,D,H,...result})],{type:'application/json'}));a.download='transport.json';a.click()};$('run').click()</script></html>
